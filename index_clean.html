        let activeTab = 'hangat';

        // ═══════════════════════════════════════════
        // CARD RENDERERS
        // ═══════════════════════════════════════════
        function renderCard(d) {
            const el = document.createElement('div');
            el.className = 'card';
            el.dataset.id = d.id;
            el.dataset.type = d.type;

            switch (d.type) {
                case 'video_vertical': el.innerHTML = renderVideoVertical(d); el.className += ' card-vv'; break;
                case 'video_horizontal': el.innerHTML = renderVideoHorizontal(d); el.className += ' card-vh'; break;
                case 'article': el.innerHTML = renderArticle(d); el.className += ' card-article'; break;
                case 'millisecond': el.innerHTML = renderMillisecond(d); el.className += ' card-ms'; break;
                case 'polling': el.innerHTML = renderPolling(d); el.className += ' card-poll'; break;
                case 'live': el.innerHTML = renderLive(d); el.className += ' card-live'; break;
            }

            attachCardEvents(el, d);
            return el;
        }

        function renderVideoVertical(d) {
            const imgEl = d.img ? `<img class="img-bg" src="${d.img}" alt="" loading="lazy">` : '';
            return `
    <div class="video-bg" style="background:${d.bgColor || '#111'};position:absolute;inset:0">
      ${imgEl}
      <div class="play-center">▶</div>
    </div>
    <div class="grad-top"></div>
    <div class="grad-bottom"></div>
    <button class="action-btn speaker-btn" data-muted="true" aria-label="Toggle mute">🔇</button>
    <div class="card-meta">
      <div class="pillar-badge">${d.pillarIcon} ${d.pillar.charAt(0).toUpperCase() + d.pillar.slice(1)}</div>
      <div class="card-category">${d.category}</div>
      <div class="card-title">${d.title}</div>
      <div class="card-time">${d.time}</div>
    </div>
    <div class="card-actions">
      <button class="action-btn" aria-label="Share">📤</button>
      <button class="action-btn" aria-label="Save">🔖</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${Math.random() * 70 + 10}%"></div></div>
  `;
        }

        function renderVideoHorizontal(d) {
            const imgEl = d.img ? `<img class="img-bg" src="${d.img}" alt="" loading="lazy" style="opacity:0.55">` : '';
            return `
    <div style="position:absolute;inset:0;background:${d.bgColor || '#000'}">${imgEl}</div>
    <div class="grad-bottom"></div>
    <div class="vh-video-wrap">
      <div class="vh-video" style="background:rgba(0,0,0,0.55);position:relative;overflow:hidden">
        ${d.img ? `<img src="${d.img}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7" alt="">` : ''}
        <span style="font-size:48px;position:relative;z-index:2">▶</span>
        <button class="vh-fullscreen" style="z-index:3">⛶</button>
      </div>
    </div>
    <div class="vh-info">
      <div class="pillar-badge">${d.pillarIcon} ${d.pillar.charAt(0).toUpperCase() + d.pillar.slice(1)}</div>
      <div class="card-category">${d.category}</div>
      <div class="card-title">${d.title}</div>
      <div class="card-time">${d.time}</div>
    </div>
    <div class="card-actions">
      <button class="action-btn" aria-label="Share">📤</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${Math.random() * 60 + 20}%"></div></div>
  `;
        }

        function renderArticle(d) {
            const imgEl = d.img
                ? `<img src="${d.img}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center" alt="" loading="lazy">`
                : `<span style="font-size:56px;opacity:.3">📰</span>`;
            return `
    <div class="article-thumb" style="background:${d.bgColor || '#003366'};position:relative">
      ${imgEl}
      <div class="article-thumb-label" style="position:absolute;top:14px;left:14px">${d.category}</div>
    </div>
    <div class="article-body">
      <div class="article-cat">${d.category}</div>
      <div class="article-title">${d.title}</div>
      <div class="article-lede">${d.lede}</div>
      <div class="article-row">
        <span class="article-time">⏱ ${d.time}</span>
        <button class="baca-btn" data-article-id="${d.id}">Baca Selengkapnya →</button>
      </div>
    </div>
  `;
        }

        function renderMillisecond(d) {
            const bullets = d.bullets.map(b => `<div class="ms-bullet"><span class="ms-dash">—</span><span>${b}</span></div>`).join('');
            return `
    <div class="ms-texture"></div>
    <div class="ms-content">
      <div class="ms-logo">
        <div class="ms-logo-text">Mili<em>detik</em> ⚡</div>
      </div>
      <div class="ms-badge">⚡ MILIDETIK</div>
      <div class="ms-headline">${d.title}</div>
      <div class="ms-bullets">${bullets}</div>
    </div>
    <div class="ms-audio">
      <button class="audio-play" data-playing="false" aria-label="Play audio">▶</button>
      <div class="audio-wave">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div class="audio-info">
        <div class="audio-dur">0:45</div>
        <div class="audio-label">Dirangkum oleh AI detik</div>
      </div>
    </div>
    <div class="progress-bar" style="bottom:48px"><div class="progress-fill" style="width:0%"></div></div>
  `;
        }

        function renderPolling(d) {
            const total = d.votes.reduce((a, b) => a + b, 0);
            const opts = d.options.map((o, i) => {
                const pct = Math.round((d.votes[i] / total) * 100);
                return `
      <button class="poll-opt" data-index="${i}" data-pct="${pct}">
        <div class="poll-bar" style="width:0%"></div>
        <div class="poll-opt-text">
          <span class="poll-label">${o}</span>
          <span class="poll-pct" style="display:none">${pct}%</span>
        </div>
      </button>`;
            }).join('');
            const totalFmt = (total + Math.floor(Math.random() * 5000)).toLocaleString('id-ID');
            return `
    <div class="poll-thumb" style="background:${d.bgColor || '#001A33'};position:relative;overflow:hidden">
      ${d.img ? `<img src="${d.img}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5" alt="" loading="lazy">` : `<span style="font-size:52px">📊</span>`}
      <div class="poll-badge" style="position:absolute;top:10px;left:10px">📊 POLLING</div>
    </div>
    <div class="poll-body">
      <div class="poll-q">${d.title}</div>
      <div class="poll-options">${opts}</div>
      <div class="poll-votes" style="display:none">${totalFmt} suara</div>
    </div>
  `;
        }

        function renderLive(d) {
            const imgEl = d.img ? `<img src="${d.img}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45" alt="" loading="lazy">` : '';
            return `
    <div style="position:absolute;inset:0;background:${d.bgColor || '#0a0a0a'}">${imgEl}</div>
    <div class="grad-bottom"></div>
    <div class="live-badge">
      <div class="live-dot"></div>
      <span class="live-text">LIVE</span>
    </div>
    <div class="live-viewers">👁 ${d.viewers}</div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
      <div class="play-center" style="width:80px;height:80px;font-size:32px">▶</div>
    </div>
    <button class="action-btn speaker-btn" data-muted="true" aria-label="Toggle mute">🔇</button>
    <div class="live-program">
      <div class="live-prog-name">${d.program}</div>
      <div class="live-prog-title">${d.title}</div>
    </div>
    <div class="card-actions">
      <button class="action-btn">📤</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:100%;animation:liveBar 2s linear infinite alternate"></div></div>
    <style>.progress-bar .progress-fill{background:#E8192C}</style>
  `;
        }

        // ═══════════════════════════════════════════
        // EVENTS PER CARD
        // ═══════════════════════════════════════════
        function attachCardEvents(el, d) {
            // Speaker toggle
            el.querySelectorAll('.speaker-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    const muted = btn.dataset.muted === 'true';
                    btn.dataset.muted = !muted;
                    btn.textContent = muted ? '🔊' : '🔇';
                });
            });

            // Article drawer
            if (d.type === 'article') {
                const baca = el.querySelector('.baca-btn');
                if (baca) baca.addEventListener('click', e => {
                    e.stopPropagation();
                    openDrawer(d);
                });
            }

            // Polling
            if (d.type === 'polling') {
                el.querySelectorAll('.poll-opt').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (polledCards.has(d.id)) return;
                        polledCards.add(d.id);
                        const allOpts = el.querySelectorAll('.poll-opt');
                        allOpts.forEach(o => o.classList.add('voted'));
                        btn.classList.add('selected');
                        // animate bars
                        allOpts.forEach(o => {
                            o.querySelector('.poll-bar').style.width = o.dataset.pct + '%';
                            o.querySelector('.poll-pct').style.display = 'block';
                        });
                        el.querySelector('.poll-votes').style.display = 'block';
                    });
                });
            }

            // Audio play/pause
            if (d.type === 'millisecond') {
                const playBtn = el.querySelector('.audio-play');
                const fill = el.querySelector('.progress-fill');
                let progress = 0, timer = null;
                playBtn.addEventListener('click', e => {
                    e.stopPropagation();
                    const playing = playBtn.dataset.playing === 'true';
                    playBtn.dataset.playing = !playing;
                    playBtn.textContent = playing ? '▶' : '⏸';
                    if (!playing) {
                        timer = setInterval(() => {
                            progress = Math.min(100, progress + 0.5);
                            if (fill) fill.style.width = progress + '%';
                            if (progress >= 100) { clearInterval(timer); playBtn.textContent = '▶'; playBtn.dataset.playing = 'false'; progress = 0; }
                        }, 225);
                    } else {
                        clearInterval(timer);
                    }
                });
            }
        }

        // ═══════════════════════════════════════════
        // DRAWER
        // ═══════════════════════════════════════════
        function openDrawer(d) {
            document.getElementById('drawerCat').textContent = d.category;
            document.getElementById('drawerTitle').textContent = d.title;
            document.getElementById('drawerBody').innerHTML = `
    <p style="margin-bottom:12px;color:#555">${d.lede}</p>
    <p style="margin-bottom:12px">Jakarta — Perkembangan terbaru mengenai <strong>${d.title}</strong> terus menarik perhatian publik nasional. Para pengamat menilai keputusan ini akan berdampak signifikan terhadap arah kebijakan ke depan.</p>
    <p style="margin-bottom:12px">Menurut sumber yang dihubungi detikcom, langkah ini merupakan bagian dari roadmap jangka panjang yang telah dipersiapkan selama beberapa bulan terakhir. Proses yang berjalan pun dinilai transparan dan sesuai prosedur.</p>
    <p style="margin-bottom:12px">"Ini adalah tonggak sejarah yang perlu dikaji secara mendalam oleh semua pihak," ujar pengamat senior dari Universitas Indonesia.</p>
    <p style="margin-bottom:12px">Reaksi dari berbagai kalangan pun bermunculan. Sebagian menyambut positif, sementara sebagian lain masih menunggu implementasi lebih lanjut di lapangan.</p>
    <p style="margin-bottom:12px">Pihak berwenang dijadwalkan akan menggelar konferensi pers lengkap pada pekan depan untuk menjelaskan rincian teknis dan timeline implementasi yang akan diambil.</p>
    <p style="color:#9E9E9E;font-size:12px">⏱ ${d.time} · ${d.category}</p>
  `;
            document.getElementById('drawer').classList.add('open');
            document.getElementById('drawer-overlay').classList.add('show');
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
            document.getElementById('drawer-overlay').classList.remove('show');
        }

        document.getElementById('drawerClose').addEventListener('click', closeDrawer);
        document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);

        // Swipe down to close drawer
        (function () {
            const dr = document.getElementById('drawer');
            let startY = 0, dragging = false;
            dr.addEventListener('touchstart', e => { startY = e.touches[0].clientY; dragging = true }, { passive: true });
            dr.addEventListener('touchmove', e => {
                if (!dragging) return;
                const dy = e.touches[0].clientY - startY;
                if (dy > 0) dr.style.transform = `translateY(${dy}px)`;
            }, { passive: true });
            dr.addEventListener('touchend', e => {
                dragging = false;
                const dy = e.changedTouches[0].clientY - startY;
                if (dy > 80) { closeDrawer(); }
                dr.style.transform = '';
            });
        })();

        // ═══════════════════════════════════════════
        // TAB SWITCHING
        // ═══════════════════════════════════════════
        function loadTab(tab) {
            activeTab = tab;
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            feedData[tab].forEach(d => {
                feed.appendChild(renderCard(d));
            });
            feed.scrollTop = 0;
            observeCards();
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                loadTab(btn.dataset.tab);
            });
        });

        // ═══════════════════════════════════════════
        // INTERSECTION OBSERVER
        // ═══════════════════════════════════════════
        function observeCards() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const el = entry.target;
                    const waves = el.querySelectorAll('.wave-bar');
                    if (entry.isIntersecting) {
                        waves.forEach(w => w.style.animationPlayState = 'running');
                        const dot = el.querySelector('.live-dot');
                        if (dot) dot.style.animationPlayState = 'running';
                    } else {
                        waves.forEach(w => w.style.animationPlayState = 'paused');
                    }
                });
            }, { threshold: 0.8 });

            document.querySelectorAll('.card').forEach(c => observer.observe(c));
        }

        // ═══════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════
        loadTab('hangat');
    </script>
</body>
